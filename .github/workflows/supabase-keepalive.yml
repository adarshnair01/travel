# Free Supabase projects pause after about a week without activity, which would break comments.
# This pings the comments API twice a week. Set the repository variables SUPABASE_URL and
# SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables); both are public.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the comments API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase variables not set; skipping."
            exit 0
          fi
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/comments?select=id&limit=1"
